spring.application.name=APIGateway
server.port=8000

eureka.instance.appname=api-gateway-service
eureka.instance.hostname=localhost

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.server.webmvc.routes[0].id=tourist-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://TouristService
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/tourist/**